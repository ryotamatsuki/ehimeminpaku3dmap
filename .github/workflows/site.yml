name: Verify and deploy 3D atlas
on:
  push:
    branches: [main]
    paths-ignore: ['data/geocode-cache.json','data/extraction-anomalies.txt','data/licensed_lodging.json','data/permit_coordinates.json']
  pull_request:
  workflow_run:
    workflows:
      - Import Ehime minpaku PDF
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install importer dependencies
        run: pip install -r requirements.txt
      - name: Check data and tests
        run: |
          node --check src/geo.mjs
          node --check src/main.mjs
          node --check src/names.mjs
          node --check src/mesh-details.mjs
          node --test tests/*.mjs
          python -m unittest discover -s tests -p 'test_*.py'
          python -m json.tool data/listings.json >/dev/null
          python -m json.tool data/licensed_lodging.json >/dev/null
          if [ -f data/permit_coordinates.json ]; then python -m json.tool data/permit_coordinates.json >/dev/null; fi
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package residential-minpaku data only
        run: |
          mkdir -p _site/src _site/data
          cp index.html .nojekyll _site/
          cp src/style.css src/main.mjs src/geo.mjs src/mesh-details.mjs _site/src/
          cp data/listings.json _site/data/
          test ! -e _site/data/licensed_lodging.json
          test ! -e _site/data/permit_coordinates.json
          test ! -e _site/src/names.mjs
          if grep -E 'permit-markers|permit-points|licensed_lodging.json|permit_coordinates.json|loadPermits|loadPermitCoordinates' _site/index.html _site/src/main.mjs; then
            echo 'ERROR: non-minpaku facility data is referenced in public site' >&2
            exit 1
          fi
          echo 'Only residential-accommodation declaration data is included.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'GitHub Pages is not enabled: Settings > Pages > Source > GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with: {path: '_site'}
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
