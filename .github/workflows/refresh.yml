name: Import Ehime minpaku PDF
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_data.py'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ehime-pdf-import
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch official PDF, extract, geocode with precision tracking
        run: python scripts/refresh_data.py
      - name: Verify extraction and JSON
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m json.tool data/listings.json >/dev/null
      - name: Commit extracted data when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/listings.json data/geocode-cache.json data/extraction-anomalies.txt
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh prefecture-wide minpaku listings [skip ci]'
            git push
          fi
