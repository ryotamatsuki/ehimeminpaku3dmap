name: Refine 979 lodging coordinates (ABR v2)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'ABR candidates for probe (0 = all)'
        type: number
        required: false
        default: 0
permissions:
  contents: write
concurrency:
  group: refine-979-lodging-coordinates
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Test exact-address matching (negative cases included)
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Refine only missing exact locations
        run: python scripts/refine_permit_geocodes.py --limit 0
      - name: Validate improvement counts and provenance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/permit_coordinates.json'))
          assert len(x['coordinates'])==979
          assert x['summary']['street']>=144
          assert x['summary']['street']+x['summary']['district']+x['summary']['unresolved']==979
          print(x['refinement'])
          PY
      - name: Commit refinement, preserving fresh remote changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/permit_coordinates.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: improve lot-level geocoding with ABR and strict match [skip ci]'
            git pull --rebase origin main
            git push
          fi
